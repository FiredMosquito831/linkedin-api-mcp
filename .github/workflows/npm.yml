name: npm publish

# Release-driven, npm-only publication. Merging to main does not publish.
# Trusted publisher: FiredMosquito831 / linkedin-api-mcp / npm.yml, no environment.
# Auth failures remain red. No long-lived npm token fallback.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.2.0"
        required: true
        type: string

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Verify tag, main ancestry and version contract
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/check-release.mjs "$TAG"
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run pack:smoke
      - name: Check whether this exact version is already published
        id: registry
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const endpoint = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`;
          const response = await fetch(endpoint, { signal: AbortSignal.timeout(30000) });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else if (response.ok) {
            const remote = await response.json();
            if (remote.name !== pkg.name || remote.version !== pkg.version) throw new Error('Unexpected npm registry response');
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
            console.log(`${pkg.name}@${pkg.version} is already published; skipping.`);
          } else {
            throw new Error(`npm registry returned HTTP ${response.status}; refusing to assume the version is absent`);
          }
          NODE

  publish:
    name: Publish to npm (OIDC)
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@latest
      - name: Recheck the version contract
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/check-release.mjs "$TAG"
      - name: Publish directly from verified source (no scripts)
        # Verification runs in the separate job without id-token permission.
        # No dependency build is needed: this package ships JavaScript source.
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::notice::Private repository: publishing without provenance (npm does not support private-repo provenance)."
            npm publish --access public --ignore-scripts --provenance=false
          else
            npm publish --access public --ignore-scripts --provenance
          fi
      - name: Verify the version directly on npm
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          for attempt in 1 2 3 4 5 6; do
            published="$(npm view "$name@$version" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              npm view "$name@$version" version dist.tarball dist.integrity
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::The expected version did not appear on npm after publication."
          exit 1
