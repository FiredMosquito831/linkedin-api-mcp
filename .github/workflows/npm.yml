name: npm publish

# npm-only publication after successful main-push CI, a published release,
# or an explicit existing-tag dispatch. Feature branches/PR runs never publish.
# Trusted publisher: FiredMosquito831 / linkedin-api-mcp / npm.yml, no environment.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v0.2.1"
        required: true
        type: string

# Serialize push/release/manual triggers so they cannot race a publication.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the publication source
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.registry.outputs.publish }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/tags/{0}', github.event.release.tag_name || inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Verify the exact commit, main ancestry and version contract
        id: source
        env:
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$sha" origin/main
          if [ "$EVENT" = "workflow_run" ]; then
            test "$sha" = "$CI_SHA"
            version="$(node -p 'require("./package.json").version')"
            node scripts/check-release.mjs "v$version"
          else
            node scripts/check-release.mjs "$TAG"
            test "$sha" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run pack:smoke
      - name: Skip existing versions and refuse registry failures
        id: registry
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const endpoint = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`;
          const response = await fetch(endpoint, { signal: AbortSignal.timeout(30000) });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=true\n');
          } else if (response.ok) {
            const remote = await response.json();
            if (remote.name !== pkg.name || remote.version !== pkg.version) throw new Error('Unexpected npm registry response');
            appendFileSync(process.env.GITHUB_OUTPUT, 'publish=false\n');
            console.log(`${pkg.name}@${pkg.version} is already published; skipping.`);
          } else {
            throw new Error(`npm registry returned HTTP ${response.status}; refusing to assume the version is absent`);
          }
          NODE

  publish:
    name: Publish to npm (OIDC)
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@latest
      - name: Recheck the version contract
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          node scripts/check-release.mjs "v$version"
      - name: Publish directly from verified source (no scripts)
        # Verification runs separately without id-token permission.
        # No dependency build is needed: this package ships JavaScript source.
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPOSITORY_PRIVATE" = "true" ]; then
            echo "::notice::Private repository: publishing without provenance (npm does not support private-repo provenance)."
            npm publish --access public --ignore-scripts --provenance=false
          else
            npm publish --access public --ignore-scripts --provenance
          fi
      - name: Verify the version directly on npm
        # The registry replicates a new version asynchronously, so it can lag the
        # publish by minutes. Query the version endpoint directly (no npm cache)
        # and wait long enough that a slow replication is not reported as a
        # failed publish.
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const endpoint = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`;
          const attempts = 30;
          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const response = await fetch(endpoint, { headers: { accept: 'application/json', 'cache-control': 'no-cache' }, signal: AbortSignal.timeout(30000) });
              if (response.status === 200) {
                const body = await response.json();
                if (body.version === pkg.version) {
                  console.log(`${pkg.name}@${pkg.version} is live on npm.`);
                  console.log(`tarball: ${body.dist.tarball}`);
                  console.log(`integrity: ${body.dist.integrity}`);
                  process.exit(0);
                }
              }
            } catch (error) {
              console.log(`attempt ${attempt}/${attempts}: ${error.message}`);
            }
            if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 20000));
          }
          console.error('::error::The version did not appear on npm within 10 minutes. The publish may still be propagating; check the registry before republishing.');
          process.exit(1);
          NODE
